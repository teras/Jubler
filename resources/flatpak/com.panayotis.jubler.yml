# Jubler Flatpak manifest
#
# To update for a new release:
#   1. Update RELEASE tag in archive URL (e.g., v9.0.2)
#   2. Replace GIT_REF in all raw.githubusercontent URLs: 67b4a81c -> v9.0.2
#   3. Recalculate sha256 hashes for changed files
#
app-id: com.panayotis.jubler
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    version: '25.08'
    directory: lib/ffmpeg
    add-ld-path: .
    autodelete: false
command: jubler

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --share=network

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk17/install.sh

  - name: libvlc
    config-opts:
      - BUILDCC=gcc
      - --disable-lua
      - --disable-a52
      - --disable-qt
      - --disable-ncurses
      - --disable-udev
    sources:
      - type: archive
        url: https://get.videolan.org/vlc/3.0.22/vlc-3.0.22.tar.xz
        sha256: e2cc1cf0ae0902a09da5a37c249a8a4e4b5ec4dc095443b8e1493c6a7cc138ea
      - type: patch
        path: vlc-ignore-time-for-cache.patch

  - name: jubler
    buildsystem: simple
    build-commands:
      - install -d /app/bin /app/lib /app/lib/ffmpeg
      - cp -r lib/* /app/lib/
      - install -Dm755 jubler /app/bin/jubler
      - install -Dm644 com.panayotis.jubler.desktop /app/share/applications/com.panayotis.jubler.desktop
      - install -Dm644 com.panayotis.jubler.metainfo.xml /app/share/metainfo/com.panayotis.jubler.metainfo.xml
      - install -Dm644 logo.svg /app/share/icons/hicolor/scalable/apps/com.panayotis.jubler.svg
    sources:
      # For local testing, use the built distribution
      - type: dir
        path: ../../build/jubler

      - type: file
        path: com.panayotis.jubler.desktop

      - type: file
        path: com.panayotis.jubler.metainfo.xml

      - type: file
        path: ../logo/logo.svg

      - type: script
        dest-filename: jubler
        commands:
          - export PATH="/app/lib/ffmpeg/bin:$PATH"
          - exec /app/jre/bin/java -jar /app/lib/jubler.jar "$@"
