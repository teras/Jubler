[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatformLauncher" }
appenh = { module = "com.panayotis:appenh", version.ref = "appenh" }
minimal-json = { module = "com.eclipsesource.minimal-json:minimal-json", version.ref = "minimalJson" }
vlcj = { module = "uk.co.caprica:vlcj", version.ref = "vlcj" }
arjs = { module = "com.panayotis:arjs", version.ref = "arjs" }
languagetool-core = { module = "org.languagetool:languagetool-core", version.ref = "languagetool" }
languagetool-en = { module = "org.languagetool:language-en", version.ref = "languagetool" }
hunspell = { module = "com.gitlab.dumonts:hunspell", version.ref = "hunspell" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
dbus-core = { module = "com.github.hypfvieh:dbus-java-core", version.ref = "dbus" }
dbus-transport-unixsocket = { module = "com.github.hypfvieh:dbus-java-transport-native-unixsocket", version.ref = "dbus" }
