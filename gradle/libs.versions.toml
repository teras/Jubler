[versions]
junitJupiter = "5.9.3"
junitPlatformLauncher = "1.9.3"
appenh = "0.8.2"
minimalJson = "0.9.5"
vlcj = "4.7.3"
arjs = "0.3.3"
languagetool = "6.5"
hunspell = "2.1.2"
slf4j = "2.0.7"
